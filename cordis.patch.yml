# dsh-mail-notify bundle patch.
#
# 这里只放**占位值**和出厂默认（enabled: false）。
# 真实邮箱写在 profile 自己的 cordis.patch.yml 覆盖层里，公开仓库就不会留下你的地址：
#
#   - id: mail-notify
#     name: 'dsh-mail-notify'
#     config:
#       enabled: true
#       smtp:
#         user: 你的账号@qq.com
#         from: 你的账号@qq.com
#       to:
#         - 收件人@qq.com
#
# 注意 patch 是整体替换 config，不是深合并：覆盖时要从 enabled 开始写全。
# host / port / secure 会按发件域名自动推断（qq.com → smtp.qq.com:465），不必手写。
#
# 授权码不放这里：优先读 authCodeEnv 指的环境变量，再读本目录下的 secret.txt。
#
# 装好后让 Agent 调用 mail_notify 工具即可自助配置：
#   action: guide   给出上面这段可粘贴的配置和授权码该放哪
#   action: status  报告当前到底会不会发信
#   action: test    立刻真发一封测试邮件

- insert:
    - id: mail-notify
      name: 'dsh-mail-notify'
      config:
        # 默认关闭：装好、重启之后也是纯惰性的——不注册监听器、不连网络、不发信。
        enabled: false
        # 占位地址。example.com 不在内置 SMTP 端点表里，所以「只把 enabled 改成 true」
        # 会得到一条明确的配置错误日志，而不是静默失败。
        smtp:
          user: you@example.com
          from: you@example.com
        to:
          - you@example.com
        subject: DSH 任务完成
        # 一个任务常要连跑好几轮（turn/end 之后还会继续），所以标题分两种：
        # 中途每轮用「进行中」，整段跑完（agent 停稳、且名下没有子代理在跑）那一封用上面的「完成」。
        subjectProgress: DSH 任务进行中
        # 中途那些轮是否各发一封；false = 一个任务只发一封（正文只带最后一轮的回答）。
        notifyProgress: true
        # agent 提问（ask_user_question）时也立刻发一封：它会让这一轮停在原地等人回答，
        # 所以正文列出问题与选项、提醒你回 DSH 界面回答；false = 提问时不发信。
        notifyQuestions: true
        # 提问通知的标题前缀；标题摘要开启时后面会接「｜第一条问题的摘要」。
        subjectQuestion: DSH 等待你的回答
        # 安静多少秒没再继续，才认为这一波任务真的结束了（0 = 不等，立刻算结束）。
        finalQuietSeconds: 5
        # 父会话 idle 但名下还有子代理（Agent Teams 成员等）在跑时，不会报「任务完成」：
        # 中途通知开着就改发「DSH 任务进行中（N 个子代理仍在跑）｜摘要」，
        # 关着就等子代理跑完再发收尾那封。
        # 标题是否在固定前缀之后带上本轮回答的摘要：「DSH 任务完成｜路径已改好」。
        subjectSummary: true
        # 摘要最多几个字，超出按字符截断并加省略号。
        subjectSummaryChars: 40
        authCodeEnv: QQ_SMTP_AUTH_CODE
        skipSubagentSessions: true
        # 这些输入来源（user/message 的 source.kind）发起的轮次整轮不发信：
        # 既不发中途的「进行中」，也不发「完成」，也不会把上一轮降级成「进行中」。
        # 默认只跳 schedule —— dsh-schedule 的定时提醒：提醒正文不是「你的任务」，
        # 为它发一封「DSH 任务完成」只会是噪音。写 [] = 一个都不跳。
        # 想连本插件自己投递的邮件（= 你回复邮件触发的那一轮）一起跳，就加
        # cordis-host-runner：注意「回信」就是那条通知本身，加了之后回复邮件就
        # 收不到答案邮件；而且那个 kind 同时被宿主动态插件 runner 的失败上报使用，
        # 所以加它也会让那些通知静音。要跳别的自动化来源（goal/webhook/tool-jobs…）
        # 照此往下列即可，没写的来源一律照常发信。
        skipSources:
          - schedule
        mergeSteps: false
        maxBodyChars: 20000
        includeSessionInfo: false
        dryRun: false
        # 收信触发：回复邮件 → 起一轮新对话。默认关闭，因为「邮件能驱动 agent」
        # 等于把执行能力暴露给邮箱，必须先想清楚白名单再开。
        reply:
          enabled: false
          # 回复投到哪儿：append = 追加到那封通知所属会话（接着原来的上下文干）；
          # new = 每封回复都开一个新对话。
          mode: append
          # 在通知正文末尾附一段 [DSH-XXXXXX] 会话 token：回复会引用原文，于是 token
          # 跟着回来，改标题也能认回原来那条会话。
          token: true
          # 关键字只在主题里匹配（大小写不敏感）。回一封通知邮件时，标题里的
          # 「DSH 任务完成…」本来就含这个关键字，所以直接回复即可。
          keyword: DSH
          keywordScope: subject
          # 必须像回复：有 In-Reply-To/References，或主题以 Re:/回复: 开头。
          # 这条同时挡住本插件自己发出的通知（它不是回复），避免自我循环。
          requireReply: true
          # 「创建对话」方案：新写一封邮件、标题**整条**等于下面某条短语时，无条件新建一条
          # 会话，并把邮件正文**原样**作为这条对话的第一句话（不加「来自邮件」表头）。
          # 默认认三条自然说法，避免「创建新对话」这种写法石沉大海；也可以写成数组自己加，
          # 或者只留一条收紧（短语彼此都是精确匹配，不是子串匹配）。
          # 它不需要像回复、标题里也不需要 DSH，是「我想从零起个话题」的入口。
          # 标题带尾巴（「创建对话：改个 bug」）不算；写 false 可关掉这个方案。
          # 注意别把上面的 subject 也改成这几条短语：那样自己发的通知会撞上它们。
          createSubject:
            - 创建对话
            - 创建新对话
            - 新建对话
          # 收信触发的轮询间隔与每小时上限。
          intervalSeconds: 60
          maxPerHour: 6
          # 新会话在哪个目录干活：auto = 先认邮件里写的路径/项目名，再让默认模型从已登记的
          # 工作区里挑，挑不到才沿用最近一次发过通知的会话目录；last = 一律沿用那一个；
          # 写绝对路径则固定用它。会话会归入该目录对应的侧栏项目分组。
          cwd: auto
          # 白名单留空即取上面的 to（也就是你自己）。
          # from:
          #   - 你的账号@qq.com
